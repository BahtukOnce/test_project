# ============================================================
#  Скопируй этот файл и назови своим именем, например:
#      cp creatures/ШАБЛОН.yaml creatures/пухлик.yaml
#  Потом меняй числа и проверяй:
#      python check_creature.py creatures/пухлик.yaml
#  Команда покажет картинку и скажет, устоит ли существо.
# ============================================================

имя: Безымянное        # как зовут твоё существо
автор: имя и класс     # кто придумал

# Цвет туловища. Бывают: оранжевый, красный, синий, зелёный, жёлтый,
# фиолетовый, розовый, бирюзовый, серый, белый.
цвет: синий

туловище:
  форма: шар           # шар или капсула (капсула — вытянутое тело)
  размер: 0.25         # радиус, от 0.1 до 0.6
  # длина: 0.6         # нужна только для капсулы

# Ноги. Каждая начинается с чёрточки.
# «где» — куда смотрит нога. Бывает: спереди, спереди-слева, слева,
# сзади-слева, сзади, сзади-справа, справа, спереди-справа.
# Вместо «где» можно писать «угол» в градусах: 0 — вперёд, 90 — влево.
# Так делают, когда ног не 4, а, скажем, 6 или 7.
#
# «бедро»   — длина верхней части ноги   (0.08 ... 0.80)
# «голень»  — длина нижней части ноги    (0.08 ... 1.20)
# «толщина» — толщина ноги               (0.02 ... 0.20)
# «подъём»  — на сколько градусов голень смотрит вниз (10 ... 80).
#             Чем больше, тем выше существо стоит.
ноги:
  - {где: спереди-слева,  бедро: 0.25, голень: 0.45, толщина: 0.07, подъём: 50}
  - {где: спереди-справа, бедро: 0.25, голень: 0.45, толщина: 0.07, подъём: 50}
  - {где: сзади-слева,    бедро: 0.25, голень: 0.45, толщина: 0.07, подъём: 50}
  - {где: сзади-справа,   бедро: 0.25, голень: 0.45, толщина: 0.07, подъём: 50}

# Хвост — необязательно. Он тоже шевелится и помогает держать равновесие.
# хвост: {сегментов: 3, длина_сегмента: 0.2, толщина: 0.05}

# Сила моторов: от 20 до 400. Слабые моторы не поднимут тяжёлое тело,
# слишком сильные — подбрасывают существо и оно кувыркается.
сила_моторов: 150
